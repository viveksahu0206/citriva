services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "app.worker.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=2", "-Q", "citriva"]
    depends_on:
      redis:
        condition: service_healthy

  # Optional: local GROBID. Start with:  docker compose --profile grobid up
  # Then set GROBID_URL=http://grobid:8070 in .env. Verify the image tag on Docker Hub.
  grobid:
    image: ${GROBID_IMAGE:-grobid/grobid:0.8.2-crf}
    profiles: ["grobid"]
    ports:
      - "8070:8070"
    ulimits:
      core: 0
    init: true
